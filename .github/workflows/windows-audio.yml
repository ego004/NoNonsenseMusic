# Plays a generated tone through the Windows audio plugin on a real Windows machine (#28), with both builds of the
# plugin side by side: the pinned upstream commit (pubspec.yaml), which must pass, and pub.dev's 0.2.3, which reported
# the sound finished as it loaded and is expected to fail. Runs when this check changes, or from the Actions tab.
name: Windows audio check

on:
  push:
    paths: [".github/workflows/windows-audio.yml", "app/integration_test/windows_audio_test.dart"]
  workflow_dispatch:

jobs:
  play:
    strategy:
      fail-fast: false
      matrix:
        plugin: [pinned, pub]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - if: matrix.plugin == 'pub'
        run: |
          python - <<'EOF'
          import re
          s = open("pubspec.yaml").read()
          s = re.sub(r"  just_audio_windows:\n    git:\n(      .*\n)+", "  just_audio_windows: 0.2.3\n", s)
          open("pubspec.yaml", "w").write(s)
          EOF
          grep -n "just_audio_windows" pubspec.yaml
      - run: flutter pub get
      - run: flutter test integration_test/windows_audio_test.dart -d windows 2>&1 | tee audio-check.log
      - if: always()
        run: |
          echo "non-platform thread errors: $(grep -c 'non-platform thread' audio-check.log || true)"
          grep "AUDIO-CHECK" audio-check.log || true
