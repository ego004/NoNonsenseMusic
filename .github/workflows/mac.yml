# The Mac app (mac/): built on a real Mac on every push that touches mac/ (Swift and SwiftUI for macOS 26 build only
# there). Then its accounts self-test (NN_SELFTEST_AUTH, Debug/AuthSelfTest.swift) runs against this branch's own
# server, which the app starts itself, on a fresh music_test database and port 8765, as mac/Scripts/selftest.sh does.
# The window pictures it takes are under "Artifacts" on the run's page.
name: Mac app

on:
  push:
    paths: ["mac/**", "backend/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode (the newest on the runner)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Project file (cd mac && xcodegen)
        working-directory: mac
        run: |
          brew install xcodegen
          xcodegen
          # a committed project file without a new source file fails the daily build (which runs no xcodegen)
          git diff --exit-code -- NoNonsense.xcodeproj || echo "::warning::XcodeGen changed the project file: commit the diff above"
      - name: Build Debug (the self-tests' build)
        working-directory: mac
        run: |
          xcodebuild -project NoNonsense.xcodeproj -scheme NoNonsense -configuration Debug -derivedDataPath build build > debug.log 2>&1 || true
          grep -E "error:" debug.log | sort -u | head -40
          grep -E "warning:" debug.log | grep -v "appintentsmetadataprocessor" | sort -u | head -40
          grep -E "\*\* BUILD" debug.log
          grep -q "BUILD SUCCEEDED" debug.log
      - name: Build Release (daily use)
        working-directory: mac
        run: |
          xcodebuild -project NoNonsense.xcodeproj -scheme NoNonsense -configuration Release -derivedDataPath build build > release.log 2>&1 || true
          grep -E "error:" release.log | sort -u | head -40
          grep -E "\*\* BUILD" release.log
          grep -q "BUILD SUCCEEDED" release.log
          # the names macOS shows (menu bar and About: CFBundleName; Finder and Dock: the bundle's file name)
          app=build/Build/Products/Release/NoNonsenseMusic.app
          echo "$app: CFBundleName=$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' $app/Contents/Info.plist)," \
               "CFBundleDisplayName=$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' $app/Contents/Info.plist)"
      - name: Test database (PostgreSQL 18, music_test) and the server's packages
        run: |
          brew install postgresql@18 uv
          pg=$(brew --prefix postgresql@18)/bin
          $pg/initdb -D "$RUNNER_TEMP/pg" --auth=trust > /dev/null
          $pg/pg_ctl -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" start
          $pg/createdb music_test
          cd backend && uv sync --frozen
      - name: Self-test, accounts (NN_SELFTEST_AUTH), on the test server the app starts (8765, music_test)
        run: |
          mkdir -p "$RUNNER_TEMP/snaps"
          env NN_SELFTEST_AUTH=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > selftest.log 2>&1 || true
          grep SELFTEST selftest.log
          echo "--- the server's answers (requests only; the repo is public: no addresses, no URLs)"
          grep -hE '"(GET|POST|PUT|PATCH|DELETE) /' ~/Library/Logs/NoNonsense/server-selftest.log \
            | sed -E 's/^.*"((GET|POST|PUT|PATCH|DELETE) [^ ?]*)[^"]*" ([0-9]+).*$/\1 \3/' | sed -E 's/[0-9a-f-]{36}/<id>/g' | sort | uniq -c
          grep -q "auth: all checks pass" selftest.log
      - name: Self-test, full screen (NN_SELFTEST_FULLSCREEN), with real screenshots
        run: |
          env NN_SELFTEST_FULLSCREEN=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > fullscreen.log 2>&1 || true
          grep SELFTEST fullscreen.log
          grep -q "fullscreen: all checks pass" fullscreen.log
      - name: Self-test, YouTube's loader (NN_SELFTEST_LOADER), on a local file; then latency on real songs (counts only)
        run: |
          env NN_SELFTEST_LOADER=1 DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 120 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > loader.log 2>&1 || true
          grep SELFTEST loader.log
          grep -q "loader: all checks pass" loader.log
      - name: Self-test, latency (NN_SELFTEST_LATENCY) on real songs, if YouTube and JioSaavn answer this runner
        continue-on-error: true
        run: |
          env NN_SELFTEST_LATENCY=1 DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 200 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > latency.log 2>&1 || true
          grep "SELFTEST latency" latency.log
      - name: Self-test, Genius notes (NN_SELFTEST_GENIUS), on made-up lyrics and notes
        run: |
          env NN_SELFTEST_GENIUS=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > genius.log 2>&1 || true
          grep SELFTEST genius.log
          grep -q "genius: all checks pass" genius.log
      - name: Genius, live (the server's lookup against genius.com; counts only, never the text)
        continue-on-error: true            # Genius's website API is undocumented and may refuse a data centre
        working-directory: backend
        run: |
          uv run python -c '
          import asyncio, time
          from music_backend.models import GeniusRequest
          from music_backend.services import genius
          async def main():
              for name, artist in [("Bohemian Rhapsody", "Queen"), ("Blinding Lights", "The Weeknd")]:
                  start = time.monotonic()
                  reply = await genius.find_notes(GeniusRequest(song_name=name, artist_name=artist))
                  about = reply.about
                  print(f"{name}: found {reply.url is not None}, {len(reply.notes)} notes, about: description "
                        f"{bool(about and about.description)}, {len(about.produced_by) if about else 0} producers, "
                        f"{len(about.samples) if about else 0} samples, {time.monotonic() - start:.1f} s")
          asyncio.run(main())'
      # The redesign (15 Oct, as in the Windows app): each part's checks, with pictures of the window as it is on screen
      - name: Self-test, sidebar, Library and Jam (NN_SELFTEST_SHELL)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_SHELL=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > shell.log 2>&1 || true
          grep SELFTEST shell.log
          grep -q "shell: all checks pass" shell.log
      - name: Self-test, downloads as files and their folder (NN_SELFTEST_DOWNLOADFILES)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_DOWNLOADFILES=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 180 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > downloadfiles.log 2>&1 || true
          grep SELFTEST downloadfiles.log
          grep -q "downloadfiles: all checks pass" downloadfiles.log
      - name: Self-test, album, artist and playlist pages (NN_SELFTEST_PAGES)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_PAGES=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > pages.log 2>&1 || true
          grep SELFTEST pages.log
          grep -q "pages: all checks pass" pages.log
      - name: Self-test, player bar and Now Playing (NN_SELFTEST_BAR2)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_BAR2=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 180 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > bar2.log 2>&1 || true
          grep SELFTEST bar2.log
          grep -q "bar2: all checks pass" bar2.log
      - name: Self-test, Home (NN_SELFTEST_HOMEHERO)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_HOMEHERO=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > homehero.log 2>&1 || true
          grep SELFTEST homehero.log
          grep -q "homehero: all checks pass" homehero.log
      - name: Self-test, the command bar and its keys (NN_SELFTEST_COMMANDBAR)
        if: ${{ !cancelled() }}
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true      # a server left by a run the alarm stopped: never this app's
          env NN_SELFTEST_COMMANDBAR=1 NN_SELFTEST_VISIBLE=1 NN_SELFTEST_SNAP="$RUNNER_TEMP/snaps" DATABASE_URL=postgresql:///music_test \
            perl -e 'alarm shift; exec @ARGV' 240 mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > commandbar.log 2>&1 || true
          grep SELFTEST commandbar.log
          grep -q "commandbar: all checks pass" commandbar.log
      - name: CPU at rest on Home (NN_SELFTEST_IDLE; the Debug build, so above what you would see; a number, not a check)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          lsof -ti tcp:8765 | xargs kill 2>/dev/null || true
          env NN_SELFTEST_IDLE=40 NN_SELFTEST_VISIBLE=1 DATABASE_URL=postgresql:///music_test \
            mac/build/Build/Products/Debug/NoNonsenseMusic.app/Contents/MacOS/NoNonsenseMusic \
            -serverURL http://127.0.0.1:8765 -backendFolder "$GITHUB_WORKSPACE/backend" \
            -discordEnabled NO -ApplePersistenceIgnoreState YES > idle.log 2>&1 &
          app=$!
          for i in $(seq 1 60); do grep -q "idle: on Home now" idle.log && break; sleep 1; done
          sleep 8                                                  # Home settles: covers, the entrance
          # top's first sample has no interval behind it: the 20 after it are the measurement
          top -l 21 -s 1 -pid $app -stats cpu > cpu.txt || true
          awk 'NF == 1 && $1 ~ /^[0-9]+([.][0-9]+)?$/ { n++; if (n > 1) { s += $1; c++ } }
            END { if (c) printf "CPU at rest on Home: %.1f%% of one core, %d one-second samples\n", s / c, c;
                  else print "CPU at rest on Home: no samples; top ended with:" }' cpu.txt
          tail -4 cpu.txt
          grep SELFTEST idle.log || true
          wait $app || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-selftest-pictures
          path: ${{ runner.temp }}/snaps/
          if-no-files-found: ignore
