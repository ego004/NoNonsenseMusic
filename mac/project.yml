# The Xcode project, as text. Regenerate the .xcodeproj after editing:  cd mac && xcodegen
name: NoNonsense
options:
  bundleIdPrefix: app.nononsense
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # UI code runs on the main thread by default; background work opts out explicitly
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
packages:
  # in-place updates: Sparkle, pinned. 2.10.0 (13 Sep); its update check needs an EdDSA signature on every update,
  # which is all an ad-hoc-signed app can offer ("Either DSA must be valid, or Apple Code Signing must be valid",
  # SUUpdateValidator.m)
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  NoNonsense:
    type: application
    platform: macOS
    sources: [NoNonsense]
    dependencies:
      - package: Sparkle
      - target: NoNonsenseWidget
    info:
      path: NoNonsense/Info.plist
      properties:
        CFBundleDisplayName: NoNonsenseMusic
        # the version is MARKETING_VERSION below, in one place (Info.plist said 1.0 while the release was 0.2.0)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        # nononsense://playlist/<id> opens a playlist here (a shared link; the server's /p/<id> page hands over to it)
        CFBundleURLTypes:
          - CFBundleURLName: app.nononsense.music
            CFBundleURLSchemes: [$(NN_URL_SCHEME)]   # nononsense; the Debug build answers nononsense-debug only
        # Sparkle (Services/Updater.swift): the latest release's appcast, and the key every update must be signed with
        SUFeedURL: $(NN_UPDATE_FEED)
        SUPublicEDKey: $(NN_UPDATE_KEY)
        SUEnableAutomaticChecks: true            # Settings › Account › Check for updates says whether; no first-run prompt
        SUScheduledCheckInterval: 86400          # once a day
        SUVerifyUpdateBeforeExtraction: true     # the signature checked before anything is unzipped
        NSAppTransportSecurity:
          # the backend runs on this Mac over plain http; everything else (audio CDNs) is https
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nononsense.music
        # the name in the menu bar, the Dock, About and Finder (8 Oct). The bundle id, the preferences domain and the
        # Keychain item stay app.nononsense.music: your settings and session carry over
        PRODUCT_NAME: NoNonsenseMusic
        # no sandbox: the app must reach Discord's local socket and your local server
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"   # ad-hoc signature: runs on this Mac, no developer account needed
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: "0.6.1"   # the release; Sparkle compares it with the appcast's
        # the app icon: NoNonsense/Assets.xcassets/AppIcon, rendered from app/assets/icon/logo.svg (the one logo for every app)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "15"
        NN_URL_SCHEME: nononsense
        NN_UPDATE_FEED: https://github.com/ego004/NoNonsenseMusic/releases/latest/download/appcast.xml
        NN_UPDATE_KEY: y+sgiLPBeRJEb6RlazvQX1I7wFl2CpuBdxUGl6eViJs=   # the release key's public half (generate_keys, account nononsensemusic, 25 Oct)
      configs:
        Debug:
          # self-test builds must not answer your links: macOS would pick any copy that claims the scheme
          NN_URL_SCHEME: nononsense-debug
          # nor share your app's identity: its preferences, audio cache and session (a test copy running beside your
          # app wrote to the same cache folder and settings)
          PRODUCT_BUNDLE_IDENTIFIER: app.nononsense.music.debug
          # nor update itself: no feed, and only the update self-test's key (mac/UpdateTest) is trusted
          NN_UPDATE_FEED: ""
          NN_UPDATE_KEY: fV6+W5hiUV1hZe3TvS6AbNVbe4TJ6npYDb+Mt2R8NjQ=
        Release:
          # stripped: unstripped, the app carried 65,130 debug entries naming every source folder, the home folder of
          # whoever built it (and so their name) among them (20 Oct). Build releases in a folder whose path names nobody
          # (scripts/check-release-privacy.py checks the files before they go up)
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: non-global
  # The iPhone app (28 Oct): the Mac app's engine, its Models and Services, shared file for file; screens of its own.
  # Mac-only services (Sparkle's updates, the local server) stay out; the rest builds for both, AppKit behind #if os(macOS)
  NoNonsenseiOS:
    type: application
    platform: iOS
    sources:
      - NoNonsense-iOS
      - path: NoNonsense/Models
      - path: NoNonsense/Services
        excludes: [Updater.swift, ServerLauncher.swift]
      - path: NoNonsense/Views/Compat.swift     # Liquid Glass on iOS 26, a material in the same shape before
    info:
      path: NoNonsense-iOS/Info.plist
      properties:
        CFBundleDisplayName: NoNonsenseMusic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad: every way up, and beside other apps
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
                                                UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: app.nononsense.music
            CFBundleURLSchemes: [nononsense]
        NSAppTransportSecurity:
          # a server you run yourself may be plain http on your network or the internet
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: To reach a NoNonsenseMusic server on your network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nononsense.music
        PRODUCT_NAME: NoNonsenseMusic
        MARKETING_VERSION: "0.6.1"
        CURRENT_PROJECT_VERSION: "15"
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone and iPad
        CODE_SIGNING_ALLOWED: NO          # unsigned: AltStore or SideStore signs it with your own Apple ID
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # stripped, as the Mac app is: unstripped, the build carries the path of every source file
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: non-global
  # The Mac widget (29 Oct): a WidgetKit extension inside the app. Sandboxed, as extensions must be; it reads the app's
  # now-playing file through a read-only exception (Widget.entitlements), so no app group (which needs a developer team).
  NoNonsenseWidget:
    type: app-extension
    platform: macOS
    sources: [NoNonsense-Widget]
    info:
      path: NoNonsense-Widget/Info.plist
      properties:
        CFBundleDisplayName: NoNonsenseMusic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nononsense.music.widget
        MARKETING_VERSION: "0.6.1"
        CURRENT_PROJECT_VERSION: "15"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: NoNonsense-Widget/Widget.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated      # WidgetKit's protocols are not main-actor
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.nononsense.music.debug.widget   # a child of the Debug app's id
