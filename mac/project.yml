# The Xcode project, as text. Regenerate the .xcodeproj after editing:  cd mac && xcodegen
name: NoNonsense
options:
  bundleIdPrefix: app.nononsense
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # UI code runs on the main thread by default; background work opts out explicitly
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # the release, in one place: UpdateCheck compares it with GitHub's latest, and the widget's must be the app's
    MARKETING_VERSION: "0.2.4"
    CURRENT_PROJECT_VERSION: "6"
    CODE_SIGN_IDENTITY: "-"   # ad-hoc signature: runs on this Mac, no developer account needed
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
targets:
  NoNonsense:
    type: application
    platform: macOS
    sources: [NoNonsense]
    dependencies:
      - target: NoNonsenseWidget       # embedded in Contents/PlugIns
    info:
      path: NoNonsense/Info.plist
      properties:
        CFBundleDisplayName: NoNonsenseMusic
        # the version is MARKETING_VERSION above, in one place (Info.plist said 1.0 while the release was 0.2.0)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        # nononsense://playlist/<id> opens a playlist here (a shared link; the server's /p/<id> page hands over to it)
        CFBundleURLTypes:
          - CFBundleURLName: app.nononsense.music
            CFBundleURLSchemes: [$(NN_URL_SCHEME)]   # nononsense; the Debug build answers nononsense-debug only
        NSAppTransportSecurity:
          # the backend runs on this Mac over plain http; everything else (audio CDNs) is https
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nononsense.music
        # the name in the menu bar, the Dock, About and Finder (8 Oct). The bundle id, the preferences domain and the
        # Keychain item stay app.nononsense.music: your settings and session carry over
        PRODUCT_NAME: NoNonsenseMusic
        # no sandbox: the app must reach Discord's local socket and your local server
        ENABLE_APP_SANDBOX: NO
        # the app icon: NoNonsense/Assets.xcassets/AppIcon, rendered from app/assets/icon/logo.svg (the one logo for every app)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        NN_URL_SCHEME: nononsense
      configs:
        Debug:
          # self-test builds must not answer your links: macOS would pick any copy that claims the scheme
          NN_URL_SCHEME: nononsense-debug
          # nor share your app's identity: its preferences, audio cache and session (a test copy running beside your
          # app wrote to the same cache folder and settings)
          PRODUCT_BUNDLE_IDENTIFIER: app.nononsense.music.debug
  # The widget (#22): the song playing, on the desktop and in Notification Centre. macOS runs app extensions sandboxed
  NoNonsenseWidget:
    type: app-extension
    platform: macOS
    sources: [NoNonsenseWidget]
    info:
      path: NoNonsenseWidget/Info.plist
      properties:
        CFBundleDisplayName: NoNonsenseMusic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NoNonsenseWidget/NoNonsenseWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # the one folder the app writes the song into (WidgetFeed): read only
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/NoNonsense/Widget/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nononsense.music.widget
        PRODUCT_NAME: NoNonsenseWidget
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.nononsense.music.debug.widget   # inside the Debug app (its id is the prefix)
